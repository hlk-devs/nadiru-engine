[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nadiru-engine"
version = "0.1.0"
description = "Sovereign AI orchestration engine. A local or cloud Conductor learns your patterns and routes between providers intelligently."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "HLK Devs"},
]
keywords = ["ai", "orchestration", "llm", "ollama", "routing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[project.urls]
Homepage = "https://github.com/hlk-devs/nadiru-engine"
Repository = "https://github.com/hlk-devs/nadiru-engine"
Issues = "https://github.com/hlk-devs/nadiru-engine/issues"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
